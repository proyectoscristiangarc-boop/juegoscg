<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego de Memoria</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --card-back: #334155;
            --card-front: #3b82f6;
            --secondary-btn: #334155;
            --secondary-hover: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .top-nav {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 10px;
        }

        .btn-back {
            background-color: var(--secondary-btn);
            color: var(--text-color);
            border: none;
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-back:hover {
            background-color: var(--secondary-hover);
        }

        .btn-back:active {
            transform: scale(0.96);
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            background: rgba(15, 23, 42, 0.6);
            padding: 8px;
            border-radius: 12px;
            margin-bottom: 14px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .score-item span {
            color: var(--accent);
        }

        .memory-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 14px;
            perspective: 1000px;
        }

        .memory-card {
            aspect-ratio: 1;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.35s ease;
            border-radius: 10px;
        }

        .memory-card.flip {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            font-size: 1.6rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .card-back {
            background-color: var(--card-back);
            color: #94a3b8;
        }

        .card-front {
            background-color: var(--card-front);
            color: white;
            transform: rotateY(180deg);
        }

        .btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .win-message {
            display: none;
            margin-top: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #34d399;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="top-nav">
            <a href="../index.html" class="btn-back">⬅️ Menú Principal</a>
        </div>

        <h1>Juego de Memoria</h1>
        <br>
        <div class="scoreboard">
            <div class="score-item">Intentos: <span id="moves">0</span></div>
            <div class="score-item">Parejas: <span id="matches">0</span> / 8</div>
        </div>

        <div class="memory-board" id="board">
            
        </div>

        <button class="btn" id="restartBtn">Reiniciar Juego</button>
        <div class="win-message" id="winMsg">¡Felicitaciones! Has completado el memorama </div>
    </div>

    <script>
        const board = document.getElementById('board');
        const movesDisplay = document.getElementById('moves');
        const matchesDisplay = document.getElementById('matches');
        const restartBtn = document.getElementById('restartBtn');
        const winMsg = document.getElementById('winMsg');

        const emojis = ['🐶', '🐱', '🦊', '🐼', '🐨', '🦁', '🐯', '🐰'];
        let cardsArray = [...emojis, ...emojis];

        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let moves = 0;
        let matches = 0;

        function startGame() {
            board.innerHTML = '';
            hasFlippedCard = false;
            lockBoard = false;
            firstCard = null;
            secondCard = null;
            moves = 0;
            matches = 0;
            movesDisplay.textContent = moves;
            matchesDisplay.textContent = matches;
            winMsg.style.display = 'none';

            cardsArray.sort(() => Math.random() - 0.5);

            cardsArray.forEach((emoji) => {
                const card = document.createElement('div');
                card.classList.add('memory-card');
                card.dataset.emoji = emoji;

                card.innerHTML = `
                    <div class="card-face card-back">❓</div>
                    <div class="card-face card-front">${emoji}</div>
                `;

                card.addEventListener('pointerdown', flipCard);
                board.appendChild(card);
            });
        }

        function flipCard(e) {
            e.preventDefault();
            if (lockBoard) return;
            const clickedCard = this;
            if (clickedCard === firstCard) return;

            clickedCard.classList.add('flip');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = clickedCard;
                return;
            }

            secondCard = clickedCard;
            moves++;
            movesDisplay.textContent = moves;

            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            firstCard.removeEventListener('pointerdown', flipCard);
            secondCard.removeEventListener('pointerdown', flipCard);

            matches++;
            matchesDisplay.textContent = matches;

            resetBoard();

            if (matches === emojis.length) {
                winMsg.style.display = 'block';
            }
        }

        function unflipCards() {
            lockBoard = true;

            setTimeout(() => {
                firstCard.classList.remove('flip');
                secondCard.classList.remove('flip');

                resetBoard();
            }, 750);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        restartBtn.addEventListener('click', startGame);

        startGame();
    </script>
</body>
</html>
