<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego de la Culebrita</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #111;
            --text-color: #ffffff;
            --accent: #4CAF50;
            --accent-hover: #388E3C;
            --secondary-btn: #333333;
            --secondary-hover: #444444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 12px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 20px;
            border: 3px solid var(--accent);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .top-nav {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 8px;
        }

        .btn-back {
            background-color: var(--secondary-btn);
            color: var(--text-color);
            border: none;
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-back:hover {
            background-color: var(--secondary-hover);
        }

        .btn-back:active {
            transform: scale(0.96);
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 4px;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .scoreboard {
            font-size: 0.95rem;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .scoreboard span {
            color: var(--accent);
            font-weight: bold;
        }

        .game-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #0a0a0a;
            border: 2px solid #333;
            border-radius: 10px;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
        }

        .overlay h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            text-align: center;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.4);
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .mobile-controls {
            display: none;
            margin-top: 12px;
            grid-template-columns: repeat(3, 65px);
            grid-template-rows: repeat(2, 50px);
            gap: 8px;
            justify-content: center;
        }

        .ctrl-btn {
            background-color: var(--secondary-btn);
            color: white;
            border: 2px solid #444;
            font-size: 1.3rem;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s;
        }

        .ctrl-btn:active {
            background-color: var(--accent);
        }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        @media (max-width: 768px), (pointer: coarse) {
            .mobile-controls {
                display: grid;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-nav">
            <a href="../index.html" class="btn-back">⬅️ Menú Principal</a>
        </div>

        <h1>Culebrita</h1>
        <div class="scoreboard">Puntaje: <span id="score">0</span></div>

        <div class="game-container">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div id="startScreen" class="overlay">
                <h2 id="screenTitle">¡Listo para jugar?</h2>
                <button class="btn" id="startBtn">Iniciar Juego</button>
            </div>
        </div>
    </div>

    <div class="mobile-controls">
        <button class="ctrl-btn" id="btn-up">⬆️</button>
        <button class="ctrl-btn" id="btn-left">⬅️</button>
        <button class="ctrl-btn" id="btn-down">⬇️</button>
        <button class="ctrl-btn" id="btn-right">➡️</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const startScreen = document.getElementById("startScreen");
        const startBtn = document.getElementById("startBtn");
        const screenTitle = document.getElementById("screenTitle");

        const tileSize = 20;
        const tileCount = 20;

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameInterval = null;
        let isRunning = false;
        let changingDirection = false;

        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            spawnFood();
            startScreen.style.display = "none";
            isRunning = true;
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 100);
        }

        function gameLoop() {
            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
            checkGameOver();
        }

        function clearCanvas() {
            ctx.fillStyle = "#0a0a0a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#4CAF50" : "#81C784";
                ctx.fillRect(part.x * tileSize, part.y * tileSize, tileSize - 2, tileSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    spawnFood();
                }
            });
        }

        function drawFood() {
            ctx.fillStyle = "#FF5722";
            ctx.fillRect(food.x * tileSize, food.y * tileSize, tileSize - 2, tileSize - 2);
        }

        function checkGameOver() {
            const head = snake[0];

            const hitWall = head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount;
            
            let hitSelf = false;
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    hitSelf = true;
                }
            }

            if (hitWall || hitSelf) {
                clearInterval(gameInterval);
                isRunning = false;
                screenTitle.textContent = "¡Juego Terminado! Puntuación: " + score;
                startBtn.textContent = "Jugar de Nuevo";
                startScreen.style.display = "flex";
            }
        }

        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            if (!isRunning || changingDirection) return;

            const keyPressed = event.keyCode;
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (keyPressed === 37 && !goingRight) { dx = -1; dy = 0; changingDirection = true; }
            if (keyPressed === 38 && !goingDown) { dx = 0; dy = -1; changingDirection = true; }
            if (keyPressed === 39 && !goingLeft) { dx = 1; dy = 0; changingDirection = true; }
            if (keyPressed === 40 && !goingUp) { dx = 0; dy = 1; changingDirection = true; }
        }

        // Controles táctiles para celulares
        document.getElementById("btn-up").addEventListener("click", () => {
            if (isRunning && dy === 0 && !changingDirection) { dx = 0; dy = -1; changingDirection = true; }
        });
        document.getElementById("btn-down").addEventListener("click", () => {
            if (isRunning && dy === 0 && !changingDirection) { dx = 0; dy = 1; changingDirection = true; }
        });
        document.getElementById("btn-left").addEventListener("click", () => {
            if (isRunning && dx === 0 && !changingDirection) { dx = -1; dy = 0; changingDirection = true; }
        });
        document.getElementById("btn-right").addEventListener("click", () => {
            if (isRunning && dx === 0 && !changingDirection) { dx = 1; dy = 0; changingDirection = true; }
        });

        startBtn.addEventListener("click", initGame);
    </script>
</body>
</html>
